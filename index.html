<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melishark — by melitalove</title>
<meta name="description" content="Melishark: una app personal para aprender de tiburones. Creada por melitalove.">
<meta name="theme-color" content="#03080A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Melishark">
<style>
  @font-face{ font-family:'Special Elite'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/SpecialElite.woff2') format('woff2'); }
  @font-face{ font-family:'Libre Baskerville'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/LibreBaskerville.woff2') format('woff2'); }
  @font-face{ font-family:'Libre Baskerville'; font-style:italic; font-weight:400; font-display:swap; src:url('fonts/LibreBaskerville-Italic.woff2') format('woff2'); }
  @font-face{ font-family:'Libre Baskerville'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/LibreBaskerville-Bold.woff2') format('woff2'); }

  :root{
    --abyss:#03080A;
    --deep:#070F13;
    --panel:#0C171C;
    --panel2:#101E24;
    --sonar:#2FE0C4;
    --sonar-dim: rgba(47,224,196,0.22);
    --alert:#FF6A52;
    --ink:#050B0D;
    --paper:#E7E2D3;
    --foam:#DCE9E6;
    --foam-dim:#7E948F;
    --line: rgba(220,233,230,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:var(--abyss); color:var(--foam); font-family:'Libre Baskerville', Georgia, serif; min-height:100%; }
  body{
    background:
      radial-gradient(ellipse 800px 500px at 85% -10%, rgba(47,224,196,0.06), transparent 60%),
      linear-gradient(180deg, var(--abyss) 0%, var(--deep) 60%, #020506 100%);
    overflow-x:hidden;
  }
  h1,h2,h3,.display{ font-family:'Special Elite', monospace; letter-spacing:0.01em; color:var(--foam); font-weight:400; }

  #silhouettes{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .drift{ position:absolute; opacity:0.10; animation: driftx linear infinite; }
  @keyframes driftx{ 0%{ transform:translateX(-15vw) translateY(0);} 100%{ transform:translateX(115vw) translateY(var(--bob,0));} }

  #ruler{ position:fixed; left:10px; top:0; bottom:0; width:34px; z-index:1; display:flex; flex-direction:column; justify-content:space-between; padding:60px 0; pointer-events:none; }
  #ruler .tick{ font-size:9px; color:var(--foam-dim); font-family:'Libre Baskerville', serif; border-top:1px solid var(--line); padding-top:3px; opacity:0.5; }
  @media (max-width:900px){ #ruler{ display:none; } }

  .jaw{ position:fixed; left:0; width:100%; height:54%; background:var(--abyss); z-index:80; pointer-events:none; }
  .jaw-top{ top:0; transform:translateY(-100%);
    clip-path: polygon(0 0,100% 0,100% 78%, 94% 100%, 88% 76%, 82% 100%, 76% 76%, 70% 100%, 64% 76%, 58% 100%, 52% 76%, 46% 100%, 40% 76%, 34% 100%, 28% 76%, 22% 100%, 16% 76%, 10% 100%, 4% 76%, 0 78%); }
  .jaw-bottom{ bottom:0; transform:translateY(100%);
    clip-path: polygon(0 100%,100% 100%,100% 22%, 94% 0, 88% 24%, 82% 0, 76% 24%, 70% 0, 64% 24%, 58% 0, 52% 24%, 46% 0, 40% 24%, 34% 0, 28% 24%, 22% 0, 16% 24%, 10% 0, 4% 24%, 0 22%); }
  body.biting .jaw-top{ animation: biteTop .5s cubic-bezier(.7,0,.3,1); }
  body.biting .jaw-bottom{ animation: biteBottom .5s cubic-bezier(.7,0,.3,1); }
  @keyframes biteTop{ 0%{transform:translateY(-100%);} 42%{transform:translateY(0);} 58%{transform:translateY(0);} 100%{transform:translateY(-100%);} }
  @keyframes biteBottom{ 0%{transform:translateY(100%);} 42%{transform:translateY(0);} 58%{transform:translateY(0);} 100%{transform:translateY(100%);} }

  #splash{ position:fixed; inset:0; z-index:50; background: radial-gradient(ellipse at 50% 30%, #0A1A20, var(--abyss) 75%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px; text-align:center; overflow:hidden; }
  .splash-sonar{ position:absolute; width:900px; height:900px; border-radius:50%; border:1px solid var(--sonar-dim); animation: sweepring 4s ease-out infinite; }
  @keyframes sweepring{ 0%{ transform:scale(0.05); opacity:0.7;} 100%{ transform:scale(1); opacity:0;} }
  .compass-mark{ width:38px; height:38px; opacity:0.7; z-index:2; }
  .splash-brand{ font-size:40px; letter-spacing:0.04em; z-index:2; }
  .splash-tag{ z-index:2; color:var(--foam-dim); font-size:12px; letter-spacing:0.04em; font-family:'Libre Baskerville', serif; font-style:italic; }
  .splash-lang{ z-index:2; display:flex; gap:8px; margin-top:4px; }
  .splash-lang button{ background:transparent; border:1px solid var(--line); color:var(--foam-dim); padding:6px 12px; border-radius:999px; font-family:'Libre Baskerville', serif; font-size:12px; cursor:pointer; }
  .splash-lang button.active{ border-color:var(--sonar); color:var(--sonar); }
  #diveBtn{ z-index:2; margin-top:8px; background:var(--sonar); color:var(--abyss); border:none; padding:13px 30px; font-family:'Special Elite', monospace; letter-spacing:0.04em; font-size:13px; cursor:pointer; }

  #app{ position:relative; z-index:2; max-width:1100px; margin:0 auto; padding:26px 24px 110px 60px; opacity:0; }
  @media (max-width:900px){ #app{ padding-left:24px; padding-bottom:100px; } }
  #app.ready{ opacity:1; transition: opacity .5s ease; }

  header.top{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-bottom:18px; margin-bottom:6px; border-bottom:1px solid var(--line); }
  .brand-row h1{ font-size:20px; letter-spacing:0.03em; }
  .brand-row span{ color:var(--foam-dim); font-size:11px; font-family:'Libre Baskerville', serif; font-style:italic; display:block; margin-top:1px; }
  .top-right{ display:flex; align-items:center; gap:16px; }
  .lang-switch{ display:flex; gap:4px; }
  .lang-switch button{ background:transparent; border:1px solid var(--line); color:var(--foam-dim); font-size:11px; padding:5px 9px; border-radius:2px; cursor:pointer; font-family:'Libre Baskerville', serif; }
  .lang-switch button.active{ border-color:var(--sonar); color:var(--sonar); }

  .date-fin{ display:flex; align-items:center; gap:8px; }
  .date-fin button{ background:none; border:none; cursor:pointer; padding:0; width:22px; height:26px; }
  .date-fin button svg{ width:100%; height:100%; transition: transform .6s ease; }
  .date-fin button.spin svg{ transform: rotate(360deg); }
  .date-fin-label{ font-size:11px; color:var(--foam-dim); font-style:italic; max-width:22ch; display:none; }
  @media (min-width:700px){ .date-fin-label{ display:block; } }

  section.view{ display:none; padding-top:34px; }
  section.view.active{ display:block; animation: fade .35s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow{ color:var(--sonar); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; font-family:'Special Elite', monospace; margin-bottom:8px;}
  h2.title{ font-size:24px; }
  .lede{ color:var(--foam-dim); font-size:14.5px; max-width:60ch; line-height:1.65; margin-top:10px; font-weight:400;}

  #compassBackdrop{ position:fixed; inset:0; background:rgba(3,8,10,0.78); opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:39; }
  body.compass-open #compassBackdrop{ opacity:1; pointer-events:auto; }

  #compassToggle{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%); width:54px; height:54px; border-radius:50%; background:var(--panel2); border:1px solid var(--sonar-dim); cursor:pointer; z-index:40; display:flex; align-items:center; justify-content:center; transition: opacity .22s ease, transform .22s ease; padding:0; }
  #compassToggle svg{ width:26px; height:26px; }
  #compassToggle .glyph{ stroke:var(--sonar); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  body.compass-open #compassToggle{ opacity:0; transform:translateX(-50%) scale(0.4); pointer-events:none; }

  #compassPanel{ position:fixed; left:50%; bottom:18px; transform:translateX(-50%) scale(0.35); opacity:0; pointer-events:none; transition: transform .35s cubic-bezier(.2,.9,.3,1), opacity .25s ease; z-index:41; display:flex; flex-direction:column; align-items:center; gap:6px; }
  body.compass-open #compassPanel{ transform:translateX(-50%) scale(1); opacity:1; pointer-events:auto; }
  #compassPanel svg{ width:200px; height:200px; }
  .compass-ring{ fill:none; stroke:var(--line); stroke-width:1; }
  .compass-ring.outer{ stroke:var(--sonar-dim); }
  .compass-needle{ stroke:var(--sonar); stroke-width:2; transition: transform .5s cubic-bezier(.4,1.4,.4,1); transform-origin:100px 100px; }
  .compass-point{ cursor:pointer; }
  .compass-point circle.base{ fill:var(--panel2); stroke:var(--line); stroke-width:1; }
  .compass-point.active circle.base{ fill:var(--sonar); stroke:var(--sonar); }
  .compass-point .glyph{ stroke:var(--foam-dim); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .compass-point.active .glyph{ stroke:var(--abyss); }
  .compass-center{ fill:var(--paper); }
  #compassLabel{ font-family:'Special Elite', monospace; font-size:12px; letter-spacing:0.05em; text-transform:uppercase; color:var(--sonar); background:var(--abyss); padding:4px 12px; border:1px solid var(--line); }

  /* ---- game ---- */
  .game-top{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:20px 0 10px; }
  #gameSpecies{ max-width:260px; }
  #pinTray{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .pin{ width:22px; height:26px; opacity:0.22; }
  .pin.earned{ opacity:1; }
  .pins-count{ font-size:12px; color:var(--foam-dim); margin-bottom:16px; font-family:'Special Elite', monospace; }

  .game-wrap{ position:relative; height:400px; border:1px solid var(--line); background: radial-gradient(ellipse at 50% 100%, #0E2028, var(--abyss) 80%); overflow:hidden; touch-action:none; user-select:none; }
  .game-hud{ position:absolute; top:10px; left:12px; right:12px; display:flex; justify-content:space-between; z-index:6; font-family:'Special Elite', monospace; font-size:12px; color:var(--foam); }
  #livesDisplay{ display:flex; gap:4px; }
  #livesDisplay .life{ width:14px; height:16px; }
  #gameArea{ position:absolute; inset:0; }
  .falling-item{ position:absolute; width:32px; height:32px; pointer-events:none; }
  .mouth{ position:absolute; bottom:6px; width:80px; height:50px; margin-left:-40px; pointer-events:none; z-index:4; }
  .game-overlay{ position:absolute; inset:0; background:rgba(3,8,10,0.92); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; z-index:10; }
  .game-overlay h3{ font-size:18px; }
  .game-overlay p{ color:var(--foam-dim); font-size:13.5px; max-width:40ch; }
  .game-overlay button{ background:var(--sonar); color:var(--abyss); border:none; padding:11px 22px; font-family:'Special Elite', monospace; font-size:12.5px; cursor:pointer; }
  .riddle-options{ display:flex; flex-direction:column; gap:8px; width:100%; max-width:360px; }
  .riddle-options button{ background:var(--panel2); color:var(--foam); border:1px solid var(--line); text-align:left; padding:10px 14px; font-family:'Libre Baskerville', serif; font-size:13px; cursor:pointer; }
  .riddle-options button:hover{ border-color:var(--sonar); }
  .riddle-options button.correct{ border-color:var(--sonar); color:var(--sonar); }
  .riddle-options button.wrong{ border-color:var(--alert); color:var(--alert); }

  .companion-form{ display:flex; flex-direction:column; gap:15px; margin-top:18px; max-width:320px; }
  label{ font-size:11px; color:var(--foam-dim); letter-spacing:0.04em; text-transform:uppercase; font-family:'Special Elite', monospace; display:block; margin-bottom:6px;}
  input[type=text], select{ width:100%; background:var(--panel); border:1px solid var(--line); color:var(--foam); padding:10px 12px; border-radius:1px; font-family:'Libre Baskerville', serif; font-size:14px; }
  input:focus, select:focus{ outline:1px solid var(--sonar); outline-offset:1px; }
  button.primary{ background:var(--sonar); color:var(--abyss); border:none; padding:12px 20px; font-family:'Special Elite', monospace; letter-spacing:0.03em; font-size:12.5px; cursor:pointer; align-self:flex-start; }
  .save-note{ font-size:12px; color:var(--sonar); min-height:16px; font-style:italic; }

  .deck-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:16px; margin-top:26px; }
  .card{ perspective:1200px; height:250px; }
  .card-inner{ position:relative; width:100%; height:100%; transition: transform .5s cubic-bezier(.2,.7,.3,1); transform-style:preserve-3d; cursor:pointer; }
  .card.flipped .card-inner{ transform: rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border:1px solid var(--line); padding:16px; display:flex; flex-direction:column; }
  .front{ justify-content:space-between; align-items:center; background: linear-gradient(165deg, var(--panel2), var(--abyss)); position:relative; overflow:hidden; }
  .front .scan{ position:absolute; top:0; left:-100%; width:60%; height:100%; background:linear-gradient(90deg, transparent, rgba(47,224,196,0.14), transparent); transition:left .6s ease; }
  .card:hover .scan{ left:120%; }
  .front .badges{ align-self:flex-start; position:relative; z-index:1; }
  .front svg{ width:70px; height:auto; position:relative; z-index:1; }
  .front h3{ font-size:13px; letter-spacing:0.01em; position:relative; z-index:1; text-align:center; font-family:'Special Elite', monospace; }
  .badges{ display:flex; gap:6px; flex-wrap:wrap;}
  .badge{ font-size:9.5px; letter-spacing:0.03em; text-transform:uppercase; padding:3px 7px; border-radius:999px; border:1px solid; font-family:'Special Elite', monospace;}
  .back{ background:var(--panel); transform:rotateY(180deg); justify-content:space-between; overflow-y:auto; }
  .back .fact{ font-size:13px; line-height:1.55; color:var(--foam); }
  .back .stats{ font-size:11px; color:var(--foam-dim); border-top:1px solid var(--line); padding-top:9px; display:flex; flex-direction:column; gap:3px; font-family:'Special Elite', monospace; letter-spacing:0.01em;}
  .hint{ font-size:10px; color:var(--foam-dim); align-self:center; font-style:italic;}

  .manada-intro{ margin:24px 0 30px; max-width:70ch; color:var(--foam); font-size:14.5px; line-height:1.7; border-left:2px solid var(--sonar); padding-left:18px;}
  .social-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
  .social-row{ border:1px solid var(--line); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--panel); }
  .social-row .sname{ font-family:'Special Elite', monospace; font-size:12.5px; }

  .scale-wrap{ margin-top:28px; display:flex; flex-direction:column; gap:10px; }
  .scale-row{ display:grid; grid-template-columns:150px 1fr 60px; align-items:center; gap:12px; }
  .scale-row .sname{ font-size:12px; color:var(--foam-dim); font-family:'Special Elite', monospace; }
  .scale-track{ height:14px; background:var(--panel); position:relative; }
  .scale-fill{ height:100%; background:linear-gradient(90deg, var(--sonar), var(--paper)); }
  .scale-val{ font-size:12px; color:var(--foam); text-align:right; }
  .scale-ref{ margin-top:10px; font-size:11.5px; color:var(--foam-dim); font-style:italic; }

  .map-controls{ margin:22px 0 16px; }
  .map-wrap{ border:1px solid var(--line); background:var(--panel); position:relative; overflow:hidden; }
  .map-wrap svg{ width:100%; height:auto; display:block; }
  .map-zoom-group{ transition: transform 0.9s cubic-bezier(.3,.7,.2,1); transform-origin: 0px 0px; }
  .continent{ fill:#132229; }
  .route-line{ animation: dashflow 1.6s linear infinite; }
  @keyframes dashflow{ to{ stroke-dashoffset:-20; } }
  .hotspot .ring{ fill:none; stroke:var(--sonar); stroke-width:1; opacity:0.5; animation: pulsedot 2.4s ease-out infinite; transform-origin:center; }
  @keyframes pulsedot{ 0%{ transform:scale(0.4); opacity:0.7;} 100%{ transform:scale(2.4); opacity:0;} }
  .hotspot text{ fill:var(--foam); font-size:9px; font-family:'Libre Baskerville', serif; }

  .track-card{ border:1px solid var(--line); padding:26px; margin-top:22px; background:linear-gradient(160deg, var(--panel2), var(--deep)); display:flex; flex-direction:column; gap:12px; }
  .track-card h3{ font-size:16px; }
  .track-card p{ color:var(--foam-dim); font-size:13.5px; line-height:1.65; max-width:62ch;}
  a.official{ align-self:flex-start; margin-top:4px; color:var(--abyss); background:var(--sonar); padding:11px 18px; text-decoration:none; font-family:'Special Elite', monospace; letter-spacing:0.03em; font-size:12px; }
  .featured{ margin-top:20px; border-left:2px solid var(--alert); padding-left:16px; }
  .featured .tag{ font-size:10.5px; color:var(--alert); text-transform:uppercase; letter-spacing:0.04em; font-family:'Special Elite', monospace; }
  .featured h4{ font-family:'Special Elite', monospace; font-size:15px; margin:6px 0 8px;}
  .featured p{ color:var(--foam-dim); font-size:13px; line-height:1.6; max-width:58ch;}

  .cosmic-wrap{ display:grid; grid-template-columns:300px 1fr; gap:32px; margin-top:24px; align-items:start;}
  @media (max-width:760px){ .cosmic-wrap{ grid-template-columns:1fr; } }
  .reading{ border:1px solid var(--line); padding:26px; background: var(--panel2); min-height:210px; }
  .reading h3{ font-size:18px; margin-top:6px; }
  .reading p{ color:var(--foam); font-size:13.5px; line-height:1.7; margin-top:12px; max-width:56ch;}
  .reading .disclaimer{ margin-top:16px; font-size:11px; color:var(--foam-dim); font-style:italic; }

  footer.foot{ margin-top:56px; padding-top:18px; border-top:1px solid var(--line); color:var(--foam-dim); font-size:11px; font-style:italic; }

  input[type=date], textarea{ width:100%; background:var(--panel); border:1px solid var(--line); color:var(--foam); padding:10px 12px; border-radius:1px; font-family:'Libre Baskerville', serif; font-size:14px; color-scheme:dark; }
  textarea{ resize:vertical; min-height:84px; line-height:1.5; }
  .icon-btn{ background:transparent; border:1px solid var(--line); color:var(--foam-dim); width:34px; height:34px; border-radius:2px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; }
  .icon-btn.on{ border-color:var(--sonar); color:var(--sonar); }
  .icon-btn svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .block{ border:1px solid var(--line); padding:24px; margin-top:26px; background:linear-gradient(160deg, var(--panel2), var(--deep)); }
  .block h3{ font-size:17px; margin-bottom:8px; }
  .block p{ color:var(--foam-dim); font-size:13px; line-height:1.65; margin-top:8px; max-width:60ch; }
  .daily-row{ display:flex; gap:20px; align-items:center; margin-top:12px; }
  .daily-row svg{ width:84px; height:98px; flex:none; }
  .daily-row .quote{ color:var(--sonar); font-style:italic; }
  .rank-bar{ height:6px; background:var(--panel); border:1px solid var(--line); margin-top:12px; }
  .rank-bar > i{ display:block; height:100%; background:var(--sonar); }
  .rank-stats{ display:flex; flex-wrap:wrap; gap:8px 20px; margin-top:14px; font-family:'Special Elite', monospace; font-size:12px; color:var(--foam-dim); }
  .rank-stats b{ color:var(--foam); font-weight:400; }
  .note{ border-top:1px solid var(--line); padding:12px 0; }
  .note .meta{ font-family:'Special Elite', monospace; font-size:11px; color:var(--sonar); display:flex; justify-content:space-between; gap:10px; }
  .note p{ color:var(--foam); margin-top:6px; white-space:pre-wrap; word-break:break-word; }
  .note button{ background:none; border:none; color:var(--foam-dim); cursor:pointer; font-size:11px; text-decoration:underline; padding:0; font-family:inherit; }
  .journal-form{ display:flex; flex-direction:column; gap:12px; max-width:480px; margin-top:14px; }
  .btn-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  button.ghost{ background:transparent; color:var(--sonar); border:1px solid var(--sonar); padding:11px 18px; font-family:'Special Elite', monospace; font-size:12.5px; cursor:pointer; }
  #shareOut{ margin-top:14px; }
  #shareOut canvas{ max-width:260px; width:100%; height:auto; border:1px solid var(--line); display:block; }
  .privacy{ font-size:11px; color:var(--foam-dim); font-style:italic; max-width:320px; }

  .zone{ cursor:pointer; }
  .zone-area{ fill:rgba(47,224,196,.07); stroke:rgba(47,224,196,.35); stroke-width:1; transition:fill .2s; }
  .zone:hover .zone-area{ fill:rgba(47,224,196,.16); }
  .zone.sel .zone-area{ fill:rgba(47,224,196,.26); stroke:#2FE0C4; stroke-width:1.6; }
  .zone text{ fill:#DCE9E6; font-family:'Special Elite', monospace; font-size:26px; text-anchor:middle; pointer-events:none; }
  .atlas-bar{ display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-top:18px; }
  .atlas-bar > div{ flex:1 1 200px; }
  .atlas-card{ height:400px; }
  .atlas-card .front .cover{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.92; }

const SHAPE_D = {
  tri:'M20 100 C 20 60, 35 20, 60 5 C 70 25, 72 60, 68 100 Z',
  falcate:'M20 100 C 20 60, 28 20, 48 4 C 54 20, 50 45, 40 62 C 52 60, 62 75, 60 100 Z',
  hammer:'M20 100 C 20 55, 28 10, 48 2 C 56 4, 58 15, 56 30 C 55 55, 55 78, 58 100 Z',

};
function finSVG(shape, color, pattern){
  let extra = '';
  if(pattern==='dots') extra = '<circle cx="35" cy="70" r="4" fill="#E7E2D3"/><circle cx="48" cy="55" r="3" fill="#E7E2D3"/><circle cx="55" cy="80" r="3.5" fill="#E7E2D3"/><circle cx="42" cy="90" r="2.5" fill="#E7E2D3"/>';
  if(pattern==='stripes') extra = '<path d="M35 90 L45 40" stroke="#1A1710" stroke-width="4"/><path d="M48 95 L56 45" stroke="#1A1710" stroke-width="4"/><path d="M58 98 L64 55" stroke="#1A1710" stroke-width="4"/>';
  if(pattern==='mottle') extra = '<circle cx="40" cy="75" r="6" fill="#3E362C" opacity="0.7"/><circle cx="55" cy="60" r="5" fill="#3E362C" opacity="0.7"/><circle cx="48" cy="90" r="4" fill="#3E362C" opacity="0.7"/>';
  if(pattern==='speckle'){ for(let j=0;j<12;j++){ const sx=30+((j*7)%35), sy=50+((j*11)%45); extra += `<circle cx="${sx}" cy="${sy}" r="1.2" fill="#8A8478"/>`; } }
  if(pattern==='tip') extra = '<path d="M48 2 C 56 4, 58 15, 56 30 C 50 26, 46 15, 48 2 Z" fill="#FFFFFF" stroke="#050B0D" stroke-width="3" stroke-linejoin="round"/>';
  if(pattern==='patch') extra = '<ellipse cx="42" cy="88" rx="10" ry="7" fill="#C8D4D6" opacity="0.6"/>';
  return `<path d="${SHAPE_D[shape]}" fill="${color}" stroke="#050B0D" stroke-width="5" stroke-linejoin="round"/>${extra}`;
}

function buildCompass(){
  const cx=100, cy=100, r=76;
  let html = `<circle class="compass-ring outer" cx="${cx}" cy="${cy}" r="${r+16}"/>
              <circle class="compass-ring" cx="${cx}" cy="${cy}" r="${r}"/>
              <line class="compass-needle" id="compassNeedle" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-r}"/>`;
  TAB_KEYS.forEach((k,i)=>{
    const step = 360/TAB_KEYS.length;
    const ang = (i*step) * Math.PI/180;
    const x = cx + r*Math.sin(ang);
    const y = cy - r*Math.cos(ang);
    compassPointsMeta.push({k, x, y, ang:i*step});
    html += `<g class="compass-point" data-tab="${k}" transform="translate(${x},${y})">
      <circle class="base" r="15"/>
      <g transform="scale(1.1)">${COMPASS_ICON[k]}</g>
    </g>`;
  });
  html += `<circle class="compass-center" cx="${cx}" cy="${cy}" r="4"/>`;
  compassSvgEl.innerHTML = html;

  compassSvgEl.querySelectorAll('.compass-point').forEach(pt=>{
    pt.addEventListener('click', ()=>{
      const k = pt.dataset.tab;
      if(k===activeTab) return;
      goToTab(k);
    });
  });
  updateCompassActive();
}

function updateCompassActive(){
  compassSvgEl.querySelectorAll('.compass-point').forEach(pt=>{
    pt.classList.toggle('active', pt.dataset.tab===activeTab);
  });
  const meta = compassPointsMeta.find(m=>m.k===activeTab);
  const needle = document.getElementById('compassNeedle');
  if(needle && meta) needle.style.transform = `rotate(${meta.ang}deg)`;
  document.getElementById('compassLabel').textContent = t('nav'+activeTab.charAt(0).toUpperCase()+activeTab.slice(1));
  const toggleIcon = document.getElementById('compassToggleIcon');
  if(toggleIcon) toggleIcon.innerHTML = COMPASS_ICON[activeTab];
}

function goToTab(k){
  stopGame();
  stopEscape();
  setCompassOpen(false);
  biteSwap(()=>{
    document.querySelectorAll('section.view').forEach(x=>x.classList.remove('active'));
    document.getElementById('view-'+k).classList.add('active');
    activeTab = k;
    updateCompassActive();
    window.scrollTo({top:0, behavior:'instant'});
    if(k==='companero'){ startIntroOverlay(); escapeIntro(); }
    if(k==='cosmico') renderPersonal();
  });
}

function proj(lat, lon){ return { x:(lon+180)/360*1000, y:(90-lat)/180*460 }; }
const CONTINENTS = [
  [[70,-165],[70,-60],[50,-55],[25,-80],[15,-95],[10,-85],[30,-115],[48,-125],[60,-140]],
  [[12,-70],[5,-50],[-10,-35],[-33,-53],[-55,-68],[-40,-73],[-18,-70],[0,-79]],
  [[37,10],[30,32],[10,45],[-25,32],[-35,20],[-20,10],[0,9],[15,-17],[30,-10]],
  [[60,5],[60,40],[45,30],[36,-9],[43,-9],[50,0],[55,10]],

];
function renderMapBase(){
  let out = '';

function renderSpeciesMap(svg, sp){
  const p0 = proj(sp.hotspots[0].lat, sp.hotspots[0].lon);
  const p1 = proj(sp.hotspots[1].lat, sp.hotspots[1].lon);
  const midX = (p0.x+p1.x)/2, midY = Math.min(p0.y,p1.y) - 50;

  let inner = bathymetryBg();
  inner += renderMapBase();
  inner += `<path d="M${p0.x} ${p0.y} Q ${midX} ${midY} ${p1.x} ${p1.y}" fill="none" style="stroke:var(--sonar)" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.55" class="route-line"/>`;

  sp.hotspots.forEach(h=>{
    const p = proj(h.lat, h.lon);
    const label = PLACES[h.p][LANG];
    inner += `<g class="hotspot" transform="translate(${p.x},${p.y})">
      <circle class="ring" r="10"/>
      <svg x="-9" y="-10" width="18" height="21" viewBox="0 0 90 105">${finSVG(sp.finShape, sp.finColor, sp.finPattern)}</svg>
      <text x="14" y="4">${label}</text>
    </g>`;
  });

  svg.innerHTML = `<g class="map-zoom-group">${inner}</g>`;

  const minX = Math.min(p0.x,p1.x), maxX = Math.max(p0.x,p1.x);
  const minY = Math.min(p0.y,p1.y), maxY = Math.max(p0.y,p1.y);
  const bboxW = Math.max(maxX-minX, 60), bboxH = Math.max(maxY-minY, 60);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  let scale = Math.min(1000/(bboxW*2.4), 460/(bboxH*2.4));
  scale = Math.max(1, Math.min(scale, 3.5));
  const tx = 500 - scale*cx;
  const ty = 230 - scale*cy;
  requestAnimationFrame(()=>{
    const g = svg.querySelector('.map-zoom-group');
    if(g) g.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  });
}

function validBirth(b){ return /^\d{4}-\d{2}-\d{2}$/.test(b||'') && !isNaN(new Date(b+'T00:00:00')); }
function lifePath(birth){
  if(!validBirth(birth)) return 0;
  const sum = x => String(x).split('').reduce((a,d)=>a+(+d),0);
  let n = sum(birth.replace(/\D/g,''));
  while(n>9 && n!==11 && n!==22 && n!==33) n = sum(n);
  return n;
}
function signFromDate(birth){
  if(!validBirth(birth)) return '';
  const m = +birth.slice(5,7), d = +birth.slice(8,10);
  const edges = [[1,20,'Capricornio'],[2,19,'Acuario'],[3,21,'Piscis'],[4,20,'Aries'],[5,21,'Tauro'],[6,21,'Géminis'],[7,23,'Cáncer'],[8,23,'Leo'],[9,23,'Virgo'],[10,23,'Libra'],[11,22,'Escorpio'],[12,22,'Sagitario']];
  let sign = 'Capricornio';
  for(const [em,ed,name] of edges){ if(m>em || (m===em && d>=ed)) sign = name; }
  return sign;
}

/* ----- share card ----- */
function finImage(sp){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>res(img);
    img.onerror = ()=>res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 105" width="180" height="210">${finSVG(sp.finShape, sp.finColor, sp.finPattern)}</svg>`);
  });
}
async function buildShareCard(){
  const cv = document.getElementById('shareCanvas');
  const g = cv.getContext('2d');
  try{ await Promise.all([document.fonts.load("40px 'Special Elite'"), document.fonts.load("italic 28px 'Libre Baskerville'")]); }catch(e){}
  const W = cv.width, H = cv.height;
  const bg = g.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#03080A'); bg.addColorStop(1,'#0C171C');
  g.fillStyle = bg; g.fillRect(0,0,W,H);
  g.strokeStyle = 'rgba(47,224,196,0.14)'; g.lineWidth = 2;
  [260,420,580,740].forEach(r=>{ g.beginPath(); g.arc(W/2, 300, r, 0, Math.PI*2); g.stroke(); });
  g.textAlign = 'center';
  g.fillStyle = '#2FE0C4'; g.font = "78px 'Special Elite', monospace"; g.fillText('MELISHARK', W/2, 150);
  const r = rankInfo();
  g.fillStyle = '#DCE9E6'; g.font = "54px 'Special Elite', monospace";
  const nm = (profile.name||'').trim();
  if(nm) g.fillText(nm, W/2, 270);
  g.fillStyle = '#2FE0C4'; g.font = "40px 'Special Elite', monospace"; g.fillText(r.name, W/2, nm?335:290);
  g.fillStyle = '#9FB5B0'; g.font = "italic 28px 'Libre Baskerville', serif";
  g.fillText(`${t('rankPins')} ${earnedPins.length}/${SPECIES.length}  ·  ${t('rankRiddles')} ${stats.riddles}  ·  ${t('rankEscapes')} ${stats.escapes}`, W/2, 395);
  const imgs = await Promise.all(SPECIES.map(finImage));
  const cols = 4, cellW = 240, cellH = 250, x0 = (W - cols*cellW)/2, y0 = 450;
  SPECIES.forEach((sp,i)=>{
    const cx = x0 + (i%cols)*cellW + cellW/2, cy = y0 + Math.floor(i/cols)*cellH;
    const own = earnedPins.includes(sp.id);
    g.globalAlpha = own ? 1 : 0.16;
    if(imgs[i]) g.drawImage(imgs[i], cx-70, cy, 140, 163);
    g.globalAlpha = 1;
    g.fillStyle = own ? '#DCE9E6' : '#5B6F6B'; g.font = "20px 'Special Elite', monospace";
    g.fillText(sp.name[LANG].slice(0,22), cx, cy+195);
  });
  g.fillStyle = '#9FB5B0'; g.font = "italic 26px 'Libre Baskerville', serif";
  g.fillText(t('footer'), W/2, H-60);
  document.getElementById('shareOut').hidden = false;
}
document.getElementById('shareBuild').addEventListener('click', buildShareCard);
document.getElementById('shareDl').addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = document.getElementById('shareCanvas').toDataURL('image/png');
  a.download = 'melishark.png';
  document.body.appendChild(a); a.click(); a.remove();
});
document.getElementById('shareSend').addEventListener('click', ()=>{
  const cv = document.getElementById('shareCanvas');
  cv.toBlob(async blob=>{
    if(!blob) return;
    const file = new File([blob], 'melishark.png', {type:'image/png'});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text:t('shareText')});

      }

    document.getElementById('shareDl').click();

});

/* ----- ocean sound ----- */
let audio = null, soundOn = false;
function startAmbience(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return false;
  const ctx = new AC();
  const len = ctx.sampleRate*4;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for(let i=0;i<len;i++){ const w = Math.random()*2-1; last = (last + 0.02*w)/1.02; d[i] = last*3.5; }
  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
  const lg = ctx.createGain(); lg.gain.value = 180;
  lfo.connect(lg); lg.connect(lp.frequency);
  const g = ctx.createGain(); g.gain.value = 0;
  g.gain.linearRampToValueAtTime(0.35, ctx.currentTime+3);
  src.connect(lp); lp.connect(g); g.connect(ctx.destination);
  src.start(); lfo.start();
  audio = {ctx, g, src, lfo};
  return true;
}
function stopAmbience(){
  if(!audio) return;
  const {ctx, g, src, lfo} = audio; audio = null;
  try{
    g.gain.cancelScheduledValues(ctx.currentTime);
    g.gain.setValueAtTime(g.gain.value, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0, ctx.currentTime+1);
  }catch(e){}
  setTimeout(()=>{ try{ src.stop(); lfo.stop(); ctx.close(); }catch(e){} }, 1100);
}
function updateSoundBtn(){
  const b = document.getElementById('soundBtn');
  if(!b) return;
  b.classList.toggle('on', soundOn);
  const label = soundOn ? t('soundOn') : t('soundOff');
  b.title = label; b.setAttribute('aria-label', label);
  b.innerHTML = soundOn
    ? '<svg viewBox="0 0 24 24"><path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0" opacity=".45"/><path d="M3 15c2-2 4-2 6 0s4 2 6 0 4-2 6 0" opacity=".45"/><path d="M4 4l16 16"/></svg>';
}

o para achar presas.", "it": "Il rostro a sega, con barbigli, rimescola il fondale per trovare prede."}}, {"id": "tigre_arena", "sci": "Carcharias taurus", "g": "cazadores", "r": ["an", "ca", "br", "sa", "au", "po"], "size": 3.2, "depth": 190, "diet": "peces", "status": "VU", "danger": 2, "shape": "low", "color": "#A19B86", "pattern": "speckle", "name": {"es": "Tiburón tigre de arena", "en": "Sand tiger shark", "pt": "Tubarão-mangona", "it": "Squalo tigre della sabbia"}, "fact": {"es": "Traga aire en la superficie para flotar casi inmóvil; dentro del útero, sus crías se devoran entre sí.", "en": "It gulps air at the surface to hover almost motionless; inside the womb, its pups devour each other.", "pt": "Engole ar na superfície para flutuar quase imóvel; dentro do útero, os filhotes devoram uns aos outros.", "it": "Ingoia aria in superficie per galleggiare quasi immobile; nell'utero i piccoli si divorano a vicenda."}}, {"id": "gato_chileno", "sci": "Schroederichthys chilensis", "g": "fondo", "r": ["pe"], "size": 0.65, "depth": 100, "diet": "crustaceo", "status": "LC", "danger": 0, "shape": "low", "color": "#A8855A", "pattern": "dots", "name": {"es": "Gato chileno", "en": "Red-spotted catshark", "pt": "Gato-chileno", "it": "Gattuccio cileno"}, "fact": {"es": "Vive en costas rocosas de Chile y Perú y pone huevos en cápsulas que se enredan en las algas.", "en": "It lives on rocky coasts of Chile and Peru and lays eggs in capsules that tangle in seaweed.", "pt": "Vive em costas rochosas do Chile e do Peru e põe ovos em cápsulas que se enroscam nas algas.", "it": "Vive sulle coste rocciose di Cile e Perù e depone uova in capsule che si impigliano nelle alghe."}}, {"id": "hinchable", "sci": "Cephaloscyllium ventriosum", "g": "fondo", "r": ["pn", "pe"], "size": 1.1, "depth": 450, "diet": "peces", "status": "LC", "danger": 0, "shape": "low", "color": "#A39070", "pattern": "mottle", "name": {"es": "Tiburón hinchable", "en": "Swell shark", "pt": "Tubarão-inchável", "it": "Squ /* ---------- almacenamiento de fotos (IndexedDB) ---------- */
let photoDB = null, photos = [];
const photoURLs = new Map();
function pdbOpen(){
  return new Promise(res=>{
    if(!('indexedDB' in window)){ res(null); return; }
    try{
      const rq = indexedDB.open('melishark-photos', 1);
      rq.onupgradeneeded = ()=>{ rq.result.createObjectStore('photos', {keyPath:'id'}); };
      rq.onsuccess = ()=> res(rq.result);
      rq.onerror = ()=> res(null);
      rq.onblocked = ()=> res(null);
    }catch(e){ res(null); }
  });
}
function pdbAll(){
  return new Promise(res=>{
    if(!photoDB){ res([]); return; }
    try{ const rq = photoDB.transaction('photos').objectStore('photos').getAll(); rq.onsuccess = ()=>res(rq.result||[]); rq.onerror = ()=>res([]); }catch(e){ res([]); }
  });
}
function pdbPut(rec){
  return new Promise(res=>{
    if(!photoDB){ res(false); return; }
    try{ const tx = photoDB.transaction('photos','readwrite'); tx.objectStore('photos').put(rec); tx.oncomplete = ()=>res(true); tx.onerror = ()=>res(false); tx.onabort = ()=>res(false); }catch(e){ res(false); }
  });
}
function pdbDel(id){
  return new Promise(res=>{
    if(!photoDB){ res(false); return; }
    try{ const tx = photoDB.transaction('photos','readwrite'); tx.objectStore('photos').delete(id); tx.oncomplete = ()=>res(true); tx.onerror = ()=>res(false); tx.onabort = ()=>res(false); }catch(e){ res(false); }
  });
}
async function loadPhotos(){
  photoDB = await pdbOpen();
  photos = (await pdbAll()).sort((a,b)=>b.ts-a.ts);
}
function urlOf(rec, kind){
  const key = rec.id+':'+kind;
  if(!photoURLs.has(key)) photoURLs.set(key, URL.createObjectURL(kind==='thumb' ? rec.thumb : rec.blob));
  return photoURLs.get(key);
}
function coverFor(id){ return photos.find(p=>p.sp===id) || null; }

async function processImage(file){
  let bmp = null;
  try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }catch(e){}
  if(!bmp){ try{ bmp = await createImageBitmap(file); }catch(e){} }
  if(!bmp){
    bmp = await new Promise((ok,no)=>{ const im = new Image(); const u = URL.createObjectURL(file); im.onload = ()=>{ URL.revokeObjectURL(u); ok(im); }; im.onerror = no; im.src = u; });
  }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  const fit = max=>{ const s = Math.min(1, max/Math.max(w0,h0)); const c = document.createElement('canvas'); c.width = Math.max(1,Math.round(w0*s)); c.height = Math.max(1,Math.round(h0*s)); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return c; };
  const toBlob = (c,q)=> new Promise(r=> c.toBlob(r,'image/jpeg',q));
  const big = fit(1280), small = fit(420);
  return {blob: await toBlob(big,.82), thumb: await toBlob(small,.78), w: big.width, h: big.height};
}

      const img = await processImage(files[i]);
      const rec = Object.assign({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), ts: Date.now()+i}, meta, img);
      if(await pdbPut(rec)){ photos.unshift(rec); ok++; } else fail++;
    }catch(e){ fail++; }
  }
  photos.sort((a,b)=>b.ts-a.ts);
  document.getElementById('albumFiles').value = '';
  document.getElementById('albumNote').value = '';
  setStatus(t('albumSaved').split('%N%').join(ok) + (fail ? ' ' + t('albumFail') : ''));
  renderAlbum(); renderAtlasList();
});

document.getElementById('photoGrid').addEventListener('click', e=>{
  const id = e.target && e.target.dataset && e.target.dataset.id;

});
function photoCaption(p){
  const parts = [];
  if(p.sp) parts.push(atlasName(p.sp));
  if(p.place) parts.push(p.place);
  parts.push(fmtDate(p.ts));
  return parts.join(' · ');
}
function showPhoto(p){
  openPhoto = p; delArmed = false;
  const lb = document.getElementById('lightbox');
  lb.querySelector('img').src = urlOf(p,'full');
  document.getElementById('lbCaption').innerHTML = `<b style="font-weight:400;color:var(--foam);">${esc(photoCaption(p))}</b>${p.note ? '<br>'+esc(p.note) : ''}${p.credit ? '<br><i>'+esc(p.credit)+'</i>' : ''}`;
  document.getElementById('lbDel').textContent = t('albumDelete');
  document.getElementById('lbShare').textContent = t('albumShare');
  document.getElementById('lbClose').textContent = t('albumClose');
  lb.classList.add('open');
}
function closePhoto(){ document.getElementById('lightbox').classList.remove('open'); openPhoto = null; delArmed = false; clearTimeout(delTimer); }
document.getElementById('lbClose').addEventListener('click', closePhoto);
document.getElementById('lightbox').addEventListener('click', e=>{ if(e.target.id==='lightbox') closePhoto(); });

document.getElementById('lbDel').addEventListener('click', async ()=>{
  if(!openPhoto) return;
  const btn = document.getElementById('lbDel');
  if(!delArmed){ delArmed = true; btn.textContent = t('albumConfirm'); clearTimeout(delTimer); delTimer = setTimeout(()=>{ delArmed = false; btn.textContent = t('albumDelete'); }, 4000); return; }
  const id = openPhoto.id;
  if(await pdbDel(id)){
    photos = photos.filter(p=>p.id!==id);
    ['full','thumb'].forEach(k=>{ const key = id+':'+k; if(photoURLs.has(key)){ URL.revokeObjectURL(photoURLs.get(key)); photoURLs.delete(key); } });
    closePhoto(); renderAlbum(); renderAtlasList();
  }
});
async function sharePhoto(p){
  const img = await new Promise(res=>{ const im = new Image(); im.onload = ()=>res(im); im.onerror = ()=>res(null); im.src = urlOf(p,'full'); });
  if(!img) return;
  const W = 1080, ph = Math.min(1350, Math.round(W*img.naturalHeight/img.naturalWidth)), bar = 150;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = ph + bar;
  const g = cv.getContext('2d');
  try{ await Promise.all([document.fonts.load("30px 'Special Elite'"), document.fonts.load("italic 22px 'Libre Baskerville'")]); }catch(e){}
  g.fillStyle = '#03080A'; g.fillRect(0,0,cv.width,cv.height);
  g.drawImage(img, 0, 0, W, ph);
  g.textAlign = 'left';
  g.fillStyle = '#DCE9E6'; g.font = "34px 'Special Elite', monospace";
  g.fillText((p.sp ? atlasName(p.sp) : t('albumDefaultTitle')).slice(0,34), 36, ph+52);
  g.fillStyle = '#2FE0C4'; g.font = "24px 'Special Elite', monospace";
  g.fillText([p.place, fmtDate(p.ts)].filter(Boolean).join(' · ').slice(0,52), 36, ph+90);
  g.fillStyle = '#9FB5B0'; g.font = "italic 20px 'Libre Baskerville', serif";
  g.fillText((p.credit || t('albumOwn')).slice(0,70), 36, ph+126);
  g.textAlign = 'right'; g.fillStyle = '#2FE0C4'; g.font = "22px 'Special Elite', monospace";
  g.fillText('Melishark v'+APP_VERSION, W-36, ph+52);
  cv.toBlob(async blob=>{
    if(!blob) return;
    const file = new File([blob], 'melishark-foto.jpg', {type:'image/jpeg'});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], text:photoCaption(p)}); return; }
    }catch(e){ if(e && e.name==='AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'melishark-foto.jpg';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }, 'image/jpeg', 0.9);
}
document.getElementById('lbShare').addEventListener('click', ()=>{ if(openPhoto) sharePhoto(openPhoto); });

function showOverlay(html){ gameOverlay.innerHTML = html; gameOverlay.style.display='flex'; }
function hideOverlay(){ gameOverlay.style.display='none'; }

function startIntroOverlay(){
  const speciesId = document.getElementById('gameSpecies').value;
  const sp = speciesById(speciesId);
  const already = earnedPins.includes(speciesId);
  showOverlay(`
    <h3>${sp.name[LANG]}</h3>
    <p>${already ? t('alreadyBody') : t('companero_lede')}</p>
    <button id="startBtnEl">${t('startBtn')}</button>`);
  document.getElementById('startBtnEl').addEventListener('click', ()=> beginRound(speciesId));
}

function beginRound(speciesId){
  hideOverlay();
  const sp = speciesById(speciesId);
  gameState = { speciesId, lives:3, correct:0, target:8, catchesSinceRiddle:0, paused:false };
  renderLives(3);
  document.getElementById('progressDisplay').textContent = `${t('progressLabel')}: 0/8`;
  gameArea.innerHTML = '';
  mouthX = gameWrap.clientWidth/2;
  mouthEl.style.left = mouthX+'px';
  gameState.spawnTimer = setInterval(()=> spawnItem(sp), 900);
  gameState.tickTimer = setInterval(tick, 30);
}

function stopGame(){
  if(gameState){
    clearInterval(gameState.spawnTimer);
    clearInterval(gameState.tickTimer);
    gameState = null;
  }
  gameArea.innerHTML = '';
  hideOverlay();
}

function spawnItem(sp){
  if(!gameState || gameState.paused) return;
  const isTrash = Math.random() < 0.22;
  const key = isTrash ? (Math.random()<0.5?'botella':'bolsa') : sp.diet[Math.floor(Math.random()*sp.diet.length)];
  const el = document.createElement('div');
  el.className = 'falling-item';
  el.dataset.trash = isTrash ? '1':'0';
  const w = gameWrap.clientWidth;
  const x = 30 + Math.random()*(w-60);
  el.style.left = x+'px';
  el.style.top = '-30px';
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','-16 -16 32 32');
  svg.innerHTML = isTrash ? TRASH_ICON[key] : FOOD_ICON[key];
  el.appendChild(svg);
  gameArea.appendChild(el);
}

function tick(){
  if(!gameState || gameState.paused) return;
  const items = Array.from(gameArea.children);
  const mouthY = gameWrap.clientHeight - 46;
  items.forEach(el=>{
    let top = parseFloat(el.style.top) + 4;
    el.style.top = top+'px';
    const left = parseFloat(el.style.left);
    if(top >= mouthY){
      if(Math.abs(left - mouthX) < 42){
        resolveCatch(el.dataset.trash==='1');
      }
      el.remove();
    } else if(top > gameWrap.clientHeight){
      el.remove();
    }
  });
}

function resolveCatch(isTrash){
  if(!gameState) return;
  if(isTrash){
    gameState.lives--;
    renderLives(gameState.lives);
    if(gameState.lives<=0){ endRound(false); }
  } else {
    gameState.correct++;
    gameState.catchesSinceRiddle++;
    document.getElementById('progressDisplay').textContent = `${t('progressLabel')}: ${gameState.correct}/${gameState.target}`;
    if(gameState.correct >= gameState.target){ endRound(true); return; }
    if(gameState.catchesSinceRiddle >= 4){ gameState.catchesSinceRiddle = 0; triggerRiddle(); }
  }
}

function triggerRiddle(){
  gameState.paused = true;
  const set = RIDDLES[LANG] || RIDDLES.es;
  const r = set[Math.floor(Math.random()*set.length)];
  const optsHtml = r.o.map((opt,i)=>`<button data-i="${i}">${opt}</button>`).join('');
  showOverlay(`<h3>${t('riddleTitle')}</h3><p>${r.q}</p><div class="riddle-options">${optsHtml}</div>`);
  gameOverlay.querySelectorAll('.riddle-options button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.i);
      gameOverlay.querySelectorAll('.riddle-options button').forEach((b,bi)=>{
        if(bi===r.c) b.classList.add('correct');
        else if(bi===i && i!==r.c) b.classList.add('wrong');
      });
      if(i===r.c){
        bumpStat('riddles');
        gameState.correct++;
        document.getElementById('progressDisplay').textContent = `${t('progressLabel')}: ${gameState.correct}/${gameState.target}`;
      }
      setTimeout(()=>{
        hideOverlay();
        if(gameState && gameState.correct >= gameState.target){ endRound(true); }
        else if(gameState){ gameState.paused = false; }
      }, 1100);
    });
  });
}

async function endRound(won){
  clearInterval(gameState.spawnTimer);
  clearInterval(gameState.tickTimer);
  const speciesId = gameState.speciesId;
  if(won && !earnedPins.includes(speciesId)){
    earnedPins.push(speciesId);
    store.set('pins', earnedPins);
    try{ renderRank(); }catch(e){}
    renderPinTray();
    renderSpeciesSelect();
  }
  showOverlay(`
    <h3>${won ? t('winTitle') : t('overTitle')}</h3>
    <p>${won ? t('winBody') : t('overBody')}</p>
    <button id="againBtn">${won ? t('nextBtn') : t('retryBtn')}</button>`);
  document.getElementById('againBtn').addEventListener('click', ()=>{
    if(won){ startIntroOverlay(); } else { beginRound(speciesId); }
  });
  gameState = null;
}

/* ================= ESCAPE GAME ================= */
let escapeState = null;
const escapeWrap = document.getElementById('escapeWrap');
const escapeArea = document.getElementById('escapeArea');
const humanEl = document.getElementById('humanEl');
const sharkChaserEl = document.getElementById('sharkChaserEl');
const escapeOverlay = document.getElementById('escapeOverlay');

function showEscapeOverlay(html){ escapeOverlay.innerHTML = html; escapeOverlay.style.display='flex'; }
function hideEscapeOverlay(){ escapeOverlay.style.display='none'; }

function stopEscape(){
  if(escapeState){
    clearInterval(escapeState.tick);
    if(escapeState.pMove) escapeWrap.removeEventListener('pointermove', escapeState.pMove);
    if(escapeState.tMove) escapeWrap.removeEventListener('touchmove', escapeState.tMove);
    escapeState = null;
  }
  hideEscapeOverlay();
}

function escapeIntro(){
  stopEscape();
  const sp = speciesById(document.getElementById('escapeSpecies').value);
  const estTag = sp.speedEstimated ? ' ' + t('speedEstimatedTag') : '';
  showEscapeOverlay(`
    <h3>${sp.name[LANG]}</h3>
    <p>${t('speedLabel')}: ${sp.speedKmh} km/h${estTag}</p>
    <p>${t('escapeLede')}</p>
    <button id="escapeStartBtn">${t('escapeStart')}</button>`);
  document.getElementById('escapeStartBtn').addEventListener('click', ()=> beginEscape(sp));
}
document.getElementById('escapeSpecies').addEventListener('change', escapeIntro);

function beginEscape(sp){
  hideEscapeOverlay();
  sharkChaserEl.querySelector('svg').innerHTML = finSVG(sp.finShape, sp.finColor, sp.finPattern);
  const w = escapeWrap.clientWidth, h = escapeWrap.clientHeight;
  let humanX = w/2, humanY = h*0.75;
  let sharkX = w*0.5, sharkY = h*0.15;
  humanEl.style.left = humanX+'px'; humanEl.style.top = humanY+'px';
  sharkChaserEl.style.left = (sharkX-30)+'px'; sharkChaserEl.style.top = (sharkY-35)+'px';

  const humanRefKmh = 8;
  let speedFactor = sp.speedKmh / humanRefKmh;
  speedFactor = Math.max(0.15, Math.min(2.3, speedFactor));
  const humanPxPerTick = 5;
  const sharkPxPerTick = humanPxPerTick * speedFactor;

  let elapsed = 0;
  const goal = 20000;
  document.getElementById('escapeTimer').textContent = `${t('escapeSurvive')}: 0/20s`;

  function onMove(clientX, clientY){
    const rect = escapeWrap.getBoundingClientRect();
    humanX = Math.max(15, Math.min(w-15, clientX-rect.left));
    humanY = Math.max(15, Math.min(h-15, clientY-rect.top));
    humanEl.style.left = humanX+'px'; humanEl.style.top = humanY+'px';
  }
  function pMove(e){ onMove(e.clientX, e.clientY); }
  function tMove(e){ const touch=e.touches[0]; onMove(touch.clientX, touch.clientY); e.preventDefault(); }
  escapeWrap.addEventListener('pointermove', pMove);
  escapeWrap.addEventListener('touchmove', tMove, {passive:false});

  escapeState = { pMove, tMove };
  escapeState.tick = setInterval(()=>{
    const dx = humanX - sharkX, dy = humanY - sharkY;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    sharkX += (dx/dist) * sharkPxPerTick;
    sharkY += (dy/dist) * sharkPxPerTick;
    sharkChaserEl.style.left = (sharkX-30)+'px';
    sharkChaserEl.style.top = (sharkY-35)+'px';
    sharkChaserEl.style.transform = dx<0 ? 'scaleX(-1)' : 'scaleX(1)';

    elapsed += 30;
    document.getElementById('escapeTimer').textContent = `${t('escapeSurvive')}: ${Math.min(20,Math.floor(elapsed/1000))}/20s`;

    if(dist < 34){
      const splash = document.createElement('div');
      splash.style.position='absolute';
      splash.style.left=(sharkX-24)+'px'; splash.style.top=(sharkY-24)+'px';
      splash.style.width='48px'; splash.style.height='48px';
      splash.style.borderRadius='50%';
      splash.style.background='radial-gradient(circle, #C23B3B 0%, #C23B3B 40%, transparent 72%)';
      splash.style.zIndex='7';
      escapeArea.appendChild(splash);
      clearInterval(escapeState.tick);
      escapeWrap.removeEventListener('pointermove', pMove);
      escapeWrap.removeEventListener('touchmove', tMove);
      escapeState = null;
      setTimeout(()=>{
        showEscapeOverlay(`<h3>${t('escapeCaughtTitle')}</h3><p>${t('escapeCaughtBody')}</p><p>${t('speedLabel')}: ${sp.speedKmh} km/h</p><button id="escRetry">${t('escapeRetryBtn')}</button>`);
        document.getElementById('escRetry').addEventListener('click', ()=>{ escapeArea.innerHTML=''; beginEscape(sp); });
      }, 220);
      return;
    }
    if(elapsed >= goal){
      clearInterval(escapeState.tick);
      escapeWrap.removeEventListener('pointermove', pMove);
      escapeWrap.removeEventListener('touchmove', tMove);
      escapeState = null;
      bumpStat('escapes');
      showEscapeOverlay(`<h3>${t('escapeWonTitle')}</h3><p>${t('escapeWonBody')}</p><p>${t('speedLabel')}: ${sp.speedKmh} km/h</p><button id="escNext">${t('escapeChangeBtn')}</button>`);
      document.getElementById('escNext').addEventListener('click', ()=>{ escapeArea.innerHTML=''; escapeIntro(); });
    }
  }, 30);
}
